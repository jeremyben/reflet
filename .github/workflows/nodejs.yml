name: Node CI

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'express/**/*.ts'
      - 'express-middlewares/**/*.ts'
      - 'mongoose/**/*.ts'
      - 'env/**/*.ts'
      - '**/*.js'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/nodejs.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'express/**/*.ts'
      - 'express-middlewares/**/*.ts'
      - 'mongoose/**/*.ts'
      - 'env/**/*.ts'
      - '**/*.js'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/nodejs.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Git checkout
        uses: actions/checkout@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install

      - name: Type check
        run: pnpm --recursive --if-present run typecheck

      - name: Test
        run: pnpm test
        env:
          CI: true
